[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acquisition-lab"
version = "0.1.0"
description = "Análise de aquisição offline (funil, coorte, mídia, razão) com detecção de change points."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "streamlit==1.39.0",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "statsmodels==0.14.2",
    "ruptures==1.1.9",
    "plotly==5.24.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.6.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
